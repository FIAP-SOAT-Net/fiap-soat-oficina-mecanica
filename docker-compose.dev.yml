services:
  db:
    image: mysql:8.4
    container_name: smart-mechanical-workshop-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
    networks:
      - mechanical-workshop-dev-network

  api:
    build:
        context: .
    container_name: smart-mechanical-workshop-api
    restart: unless-stopped
    environment:
        ASPNETCORE_ENVIRONMENT: Production
        ConnectionStrings__DefaultConnection: "server=${DB_HOST};port=${DB_PORT};database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD};SslMode=none;AllowPublicKeyRetrieval=True;"
        Jwt__Key: ${JWT_KEY}
        BaseUrl: ${BASE_URL}
        Email__SmtpHost: ${SMTP_HOST}
        Email__SmtpPort: ${SMTP_PORT}
        RabbitMQ__HostName: rabbitmq
        RabbitMQ__Port: 5672
        RabbitMQ__UserName: ${RABBITMQ_USER}
        RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
        - "5180:8080"
    volumes:
        - dataprotection_keys_dev:/app/keys
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
        interval: 30s
        timeout: 10s
        retries: 3
    depends_on:
        db:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
    networks:
        - mechanical-workshop-dev-network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog-smart-mechanical-workshop-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mechanical-workshop-dev-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-mechanical-workshop-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mechanical-workshop-dev-network

volumes:
  mysql_data_dev:
  dataprotection_keys_dev:
  rabbitmq_data_dev:

networks:
  mechanical-workshop-dev-network:
    driver: bridge
