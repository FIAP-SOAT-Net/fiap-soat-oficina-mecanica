services:
  db:
    image: mysql:8.4
    container_name: smart-mechanical-workshop-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
    networks:
      - mechanical-workshop-dev-network

  mongodb:
    image: mongo:7.0
    container_name: smart-mechanical-workshop-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mechanical-workshop-dev-network

  api:
    build:
        context: .
    container_name: smart-mechanical-workshop-api
    restart: unless-stopped
    environment:
        ASPNETCORE_ENVIRONMENT: Production
        ConnectionStrings__DefaultConnection: "server=${DB_HOST};port=${DB_PORT};database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD};SslMode=none;AllowPublicKeyRetrieval=True;"
        Jwt__Key: ${JWT_KEY}
        BaseUrl: ${BASE_URL}
        Email__SmtpHost: ${SMTP_HOST}
        Email__SmtpPort: ${SMTP_PORT}
        RabbitMQ__HostName: rabbitmq
        RabbitMQ__Port: 5672
        RabbitMQ__UserName: ${RABBITMQ_USER}
        RabbitMQ__Password: ${RABBITMQ_PASSWORD}
        RabbitMQ__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-database.events.exchange}
        RabbitMQ__QueueName: ${RABBITMQ_QUEUE_NAME:-database.events}
        RabbitMQ__NotificationsExchangeName: ${RABBITMQ_NOTIFICATIONS_EXCHANGE_NAME:-notifications.exchange}
        RabbitMQ__NotificationsQueueName: ${RABBITMQ_NOTIFICATIONS_QUEUE_NAME:-service-order.notifications}
    ports:
        - "5180:8080"
    volumes:
        - dataprotection_keys_dev:/app/keys
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
        interval: 30s
        timeout: 10s
        retries: 3
    depends_on:
        db:
            condition: service_healthy
        mongodb:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
    networks:
        - mechanical-workshop-dev-network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog-smart-mechanical-workshop-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mechanical-workshop-dev-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-mechanical-workshop-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mechanical-workshop-dev-network

  audit-log-worker:
    image: ${DOCKERHUB_USERNAME}/smart-mechanical-workshop-auditlog-worker:${IMAGE_TAG:-latest}
    container_name: smart-mechanical-workshop-auditlog-worker-dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-database.events.exchange}
      RabbitMQ__QueueName: ${RABBITMQ_QUEUE_NAME:-database.events}
      MongoDB__ConnectionString: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      MongoDB__DatabaseName: ${MONGO_DATABASE:-AuditLog}
      MongoDB__CollectionName: ${MONGO_COLLECTION:-Events}
      MongoDB__UserName: ${MONGO_ROOT_USER}
      MongoDB__Password: ${MONGO_ROOT_PASSWORD}
      NewRelic__Enabled: ${NEW_RELIC_ENABLED:-false}
      NewRelic__AppName: ${NEW_RELIC_APP_NAME:-smart-mechanical-workshop-auditlog-worker}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-smart-mechanical-workshop-auditlog-worker}
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dotnet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mechanical-workshop-dev-network


volumes:
  mongodb_data_dev:
  mysql_data_dev:
  dataprotection_keys_dev:
  rabbitmq_data_dev:

networks:
  mechanical-workshop-dev-network:
    driver: bridge
